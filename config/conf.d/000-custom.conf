tcp_nopush on;
tcp_nodelay on;
types_hash_max_size 2048;
server_tokens ${SERVER_TOKEN_TOGGLE};
client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
client_body_buffer_size 128k;
client_header_buffer_size ${NGINX_CLIENT_HEADER_BUFFER_SIZE};
large_client_header_buffers ${NGINX_LARGE_CLIENT_HEADER_BUFFERS};
server_names_hash_bucket_size 128;
map_hash_max_size ${NGINX_MAP_HASH_MAX_SIZE};
map_hash_bucket_size ${NGINX_MAP_HASH_BUCKET_SIZE};
proxy_buffer_size 512k;
proxy_buffers 4 512k;
proxy_busy_buffers_size 512k;
