    # A path ending with an encoded newline, carriage return, tab or space
    # (a link pasted together with its line break) is redirected to the same
    # URL without them. A newline, carriage return or NUL byte anywhere else in
    # the path is rejected. $request_uri stays percent-encoded, so the redirect
    # never writes a raw control character into a response header.
    set $uri_guard_proto $scheme;
    if ($http_x_forwarded_proto = "https") {
        set $uri_guard_proto "https";
    }
    if ($request_uri ~* "^(?<uri_guard_path>[^?]*?)(%0a|%0d|%09|%20)+(?<uri_guard_query>\?.*)?$") {
        return 301 $uri_guard_proto://$host$uri_guard_path$uri_guard_query;
    }
    if ($request_uri ~* "^[^?]*(%0a|%0d|%00)") {
        return 400;
    }
