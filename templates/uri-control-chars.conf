    # Any encoded control character in the path is rejected, except a trailing
    # run of encoded newlines, carriage returns or tabs (optionally mixed with
    # spaces), which is redirected to the same URL without it. $request_uri
    # stays percent-encoded, so the redirect never writes a raw control
    # character into a response header.
    if ($request_uri ~* "^[^?]*(%(0[0-8bcef]|1[0-9a-f]|7f)|%0[9ad](?!(%0[9ad]|%20)*(\?|$)))") {
        return 400;
    }
    set $uri_guard_proto $scheme;
    if ($http_x_forwarded_proto ~* "^https") {
        set $uri_guard_proto "https";
    }
    # $http_host keeps the port the client used, $host drops it.
    set $uri_guard_host $host;
    if ($http_host != "") {
        set $uri_guard_host $http_host;
    }
    if ($request_uri ~* "^(?<uri_guard_path>[^?]*?)(%20)*%0[9ad](%0[9ad]|%20)*(?<uri_guard_query>\?.*)?$") {
        return 301 $uri_guard_proto://$uri_guard_host$uri_guard_path$uri_guard_query;
    }
