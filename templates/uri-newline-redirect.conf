    # Redirect a path with encoded newlines to the same URL without the first
    # run of them; a path with several runs is cleaned one redirect at a time.
    # $request_uri stays percent-encoded, so the redirect never writes a raw
    # newline into a response header.
    set $uri_guard_proto $scheme;
    if ($http_x_forwarded_proto ~* "^https") {
        set $uri_guard_proto "https";
    }
    # $http_host keeps the port the client used, $host drops it.
    set $uri_guard_host $host;
    if ($http_host != "") {
        set $uri_guard_host $http_host;
    }
    if ($request_uri ~* "^(?<uri_guard_head>/[^?]*?)(%0[ad])+(?<uri_guard_tail>.*)$") {
        return 301 $uri_guard_proto://$uri_guard_host$uri_guard_head$uri_guard_tail;
    }
