    #security response headers not covered by the application (Referrer-Policy, Permissions-Policy and the Cross-Origin isolation headers)
    #nginx skips an add_header whose value is an empty string, so an emptied *_VALUE variable disables that single header
    add_header Referrer-Policy "${NGINX_REFERRER_POLICY_VALUE}";
    add_header Permissions-Policy "${NGINX_PERMISSIONS_POLICY_VALUE}";
    add_header Cross-Origin-Opener-Policy "${NGINX_CROSS_ORIGIN_OPENER_POLICY_VALUE}";
    add_header Cross-Origin-Embedder-Policy "${NGINX_CROSS_ORIGIN_EMBEDDER_POLICY_VALUE}";
    add_header Cross-Origin-Resource-Policy "${NGINX_CROSS_ORIGIN_RESOURCE_POLICY_VALUE}";
