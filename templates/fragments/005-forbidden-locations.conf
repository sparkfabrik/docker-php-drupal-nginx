location = /core/install.php {
  return ${NGINX_FORBIDDEN_LOCATIONS_EXIT_CODE};
}

location = /update.php {
  return ${NGINX_FORBIDDEN_LOCATIONS_EXIT_CODE};
}

# Drupal settings files (settings.php, settings.local.php) live under the site
# directory and must never be reachable. Without this block the generic PHP
# location passes them to FastCGI, which executes settings.php and returns a
# 500 instead of forbidding it.
location ~* ^/sites/[^/]+/settings[^/]*\.php$ {
  return ${NGINX_FORBIDDEN_LOCATIONS_EXIT_CODE};
}
